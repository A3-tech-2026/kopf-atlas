<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kopf-Atlas">
<title>Kopf-Atlas 3D</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body class="modus-atlas">
<div id="app">
  <header id="oben">
    <h1>Kopf-Atlas <span>3D</span></h1>
    <div id="suche">
      <input id="suchfeld" type="search" placeholder="Suchen: deutsch oder lateinisch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Suchen">
      <ul id="treffer" hidden></ul>
    </div>
    <nav id="modi" aria-label="Modus">
      <button data-modus="atlas" class="an">Atlas</button>
      <button data-modus="play">Play</button>
      <button data-modus="quiz">Quiz</button>
    </nav>
    <button id="quellenKnopf" class="rund" aria-label="Quellen und Lizenzen" title="Quellen und Lizenzen">i</button>
  </header>

  <aside id="links" aria-label="Ebenen und Ansichten">
    <button class="zu" data-zu="links" aria-label="Schliessen">×</button>
    <h2>Ebenen</h2>
    <div id="ebenen"></div>
    <label class="schalter"><input type="checkbox" id="punkteAn" checked><span class="regler"></span><span>Punkte (Details)</span></label>
    <h2>Ansichten</h2>
    <div id="ansichten"></div>
  </aside>

  <main id="mitte">
    <canvas id="szene" aria-label="3D-Modell"></canvas>
    <div id="lade"><div><p>Kopf-Atlas wird geladen …</p><div class="balken"><i id="ladeBalken"></i></div></div></div>
    <p id="makroHinweis" hidden>Schematisches Modell (nicht massstabsgetreu): Schnitt durch einen unteren Molaren im Zahnfach.
      <span><button class="btn klein" data-lupe="schmelzprisma">Lupe: Schmelzprismen</button><button class="btn klein" data-lupe="dentinkanaelchen">Lupe: Dentinkanälchen</button><button class="btn klein" data-lupe="">Ganzer Zahn</button></span></p>
    <div id="demoLeiste" hidden>
      <div class="d-text"><b id="dTitel"></b><span id="dText"></span></div>
      <div class="d-knoepfe">
        <button id="dPlay" class="btn haupt">▶ Play</button>
        <button id="dPause" class="btn">❚❚ Pause</button>
        <button id="dWeiter" class="btn">Weiter ▶▶</button>
        <span id="dZahl"></span>
      </div>
      <div class="balken"><i id="dBalken"></i></div>
    </div>
    <div id="toast" hidden></div>
  </main>

  <aside id="rechts" aria-label="Info">
    <button id="griff" aria-label="Karte öffnen oder schliessen"><i></i></button>
    <div id="vorleseLeiste">
      <button id="vorlesen" class="btn haupt">🔊 Vorlesen</button>
      <button id="stopp" class="btn" hidden>■ Stopp</button>
      <label class="schalter klein"><input type="checkbox" id="autoLesen"><span class="regler"></span><span>Automatisch vorlesen</span></label>
      <details id="stimmeBox"><summary>Stimme</summary>
        <label>Stimme <select id="stimme"></select></label>
        <label>Tempo <input type="range" id="tempo" min="0.6" max="1.4" step="0.05"> <output id="tempoWert"></output></label>
      </details>
      <p id="stimmeMeldung" role="status"></p>
    </div>
    <div id="karte"></div>
    <div id="playPanel" hidden></div>
    <div id="quizPanel" hidden></div>
  </aside>

  <nav id="unten" aria-label="Navigation">
    <button data-auf="links">☰<span>Ebenen</span></button>
    <button data-modus="atlas" class="an">◉<span>Atlas</span></button>
    <button data-modus="play">▶<span>Play</span></button>
    <button data-modus="quiz">?<span>Quiz</span></button>
    <button data-auf="rechts">▤<span>Info</span></button>
  </nav>
</div>

<dialog id="quellen"><div class="dlg"><button class="zu" data-dlg="quellen" aria-label="Schliessen">×</button><div id="quellenInhalt"></div></div></dialog>
<dialog id="infoDlg"><div class="dlg"><button class="zu" data-dlg="infoDlg" aria-label="Schliessen">×</button>
  <div class="dlg-lesen"><button id="infoVorlesen" class="btn haupt">🔊 Vorlesen</button><button id="infoStopp" class="btn">■ Stopp</button></div><div id="infoInhalt"></div></div></dialog>
<script src="daten.js"></script>
<script src="app.js"></script>
</body>
</html>
